<!-- Action principale : copier la commande, puis accéder à l'horloge démo. -->
<main class="page-main wg-layout">
    <section class="page-hero">
        <h1>WireGuard</h1>
        <p class="page-subtitle">Copiez la commande dans un terminal.</p>
    </section>

    <button type="button" class="center-pill" data-copy-command="curl -fsSL https://wg.attenna.net | sudo bash">
        <span class="command-prompt" aria-hidden="true">$</span>
        <span class="command-text">curl -fsSL https://wg.attenna.net | sudo bash</span>
        <span class="copy-icon" aria-hidden="true">
            <svg class="copy-icon-idle" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2.5"></rect><path d="M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8"></path></svg>
            <svg class="copy-icon-done" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg>
        </span>
    </button>
    <span class="visually-hidden" id="copy-status" aria-live="polite"></span>

    <div class="wg-actions">
        <a href="horloge.html" class="service-button gray">
            <span class="button-icon button-icon-in" aria-hidden="true">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
            </span>
            <span class="button-label">Horloge</span>
            <span class="button-icon button-icon-out" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
            </span>
        </a>
    </div>
</main>
<script>
    // Bouton qui porte la commande dans son attribut data, pour éviter de la dupliquer.
    const copyButton = document.querySelector(".center-pill");
    const copyStatus = document.getElementById("copy-status");
    let copiedTimer = 0;

    // Copie via l'API moderne, avec une solution de repli pour les contextes non sécurisés.
    async function copyText(text) {
        if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(text);
            return;
        }

        const textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.setAttribute("readonly", "");
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand("copy");
        document.body.removeChild(textarea);
    }

    // Affiche la coche de confirmation, puis revient à l'icône de copie.
    copyButton.addEventListener("click", async () => {
        await copyText(copyButton.dataset.copyCommand);
        copyButton.classList.add("copied");
        copyStatus.textContent = "Commande copiée";
        clearTimeout(copiedTimer);
        copiedTimer = setTimeout(() => {
            copyButton.classList.remove("copied");
            copyStatus.textContent = "";
        }, 1800);
    });
</script>
