        </a>
        <a href="https://pve2.attenna.net" class="pve-mini" target="_blank">
            <span class="button-icon button-icon-in pve-mini-icon" aria-hidden="true">

    <a href="HTML/A-Propos.html">
        <button class="service-button white">
            <span class="button-icon button-icon-in" aria-hidden="true">

                <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
            </span>
        </button>
    </a>
    <a href="https://cloud.attenna.net" target="_blank">
        <button class="service-button gray">
            <span class="button-icon button-icon-in" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M7.2 18.5h10.2a4.1 4.1 0 0 0 .5-8.2A6 6 0 0 0 6.5 9a4.8 4.8 0 0 0 .7 9.5Z"></path></svg>

            </span>
        </button>
    </a>
</div>

<!-- Moniteur de services : service-status.js le révèle, construit les lignes et suit les états. -->
<div class="status-monitor" data-state="checking" hidden>
    <button class="status-trigger" type="button" aria-expanded="false" aria-controls="service-status-panel">
        <span class="status-pulse" aria-hidden="true"></span>
        <span id="service-status-label" aria-live="polite">Vérification…</span>
        <svg class="status-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"></path></svg>
    </button>

    <div class="service-status-panel" id="service-status-panel">
        <div class="status-panel-head">
            <div>
                <div class="status-total-line">
                    <p class="status-total"><b class="status-count">–</b><span>/<i class="status-size">–</i></span></p>
                    <span class="status-pulse status-pulse-large" aria-hidden="true"></span>
                </div>
                <p class="status-summary">Vérification en cours</p>
            </div>
            <button class="status-refresh" type="button" aria-label="Relancer la vérification">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8"></path><path d="M4 4v4h4"></path><path d="M4 13a8 8 0 0 0 14.3 4.9L20 16"></path><path d="M20 20v-4h-4"></path></svg>
            </button>
        </div>
        <p class="status-updated" aria-live="off">Premier contrôle…</p>
        <ul class="status-list"></ul>
        <p class="status-note">Testé depuis votre navigateur, toutes les 60 secondes.</p>
    </div>
</div>
<!-- Chargé après le HTML afin que les éléments du moniteur soient disponibles. -->
<script type="module" src="JS/service-status.js"></script>
<script type="module" src="JS/fft-ocean.ts"></script>
</body>
</html>
